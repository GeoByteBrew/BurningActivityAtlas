# Regional configuration: Iberian Peninsula + Occitanie.
# Extends the world configuration; only the differences are listed. Use it to work on one region
# with every quality scenario and the 1 km series:
#     MVH_CONFIG=config/iberia.yaml python scripts/02_quality_control.py
extends: config.yaml

project:
  region: iberia_occitanie     # raw files in data/raw/iberia_occitanie/<SOURCE>/

aoi:
  name: Iberia + Occitanie
  mode: parts                  # the sub-regions listed below
  clip: true                   # detections outside the three sub-regions are flagged out
  snap_deg: 0.0
  file: data/aoi/aoi.geojson
  parts:
    - {name: Portugal,  source: natural_earth, iso_a3: PRT}
    - {name: Spain,     source: natural_earth, iso_a3: ESP}
    - {name: Occitanie, source: url, url: "https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/regions/occitanie/region-occitanie.geojson"}
  # also clips far islands (Canaries, Azores, Madeira)
  bbox_wgs84: [-10.0, 35.8, 5.0, 45.2]

firms:
  tile_deg: null               # one request box

grid:
  materialize_m: [5000]        # 5 km polygon layer over the AOI

run:
  jobs: 1

qc:
  aggregate_scenarios: all     # Q1, Q2, Q3 for sensitivity analysis

availability:
  # A region cannot tell a day without data from a day without fire. Copy the outages found by a
  # world run (data/harmonized/outages_used.csv) into data/ancillary/outages.csv to apply them here.
  detect_outages: false

harmonization:
  fine_scale: true             # 1 km harmonized daily series

paths:
  processed: data/iberia/processed
  grids: data/iberia/grids
  aggregated: data/iberia/aggregated
  harmonized: data/iberia/harmonized
  reports: outputs/iberia/reports
  figures: outputs/iberia/figures
  csv: outputs/iberia/csv

web:
  overview: null
  details:
    - {id: iberia_occitanie, name: "Iberia + Occitanie", bbox: null}
